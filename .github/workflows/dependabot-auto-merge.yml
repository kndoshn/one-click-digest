name: Dependabot Auto Merge

# Enables auto-merge for non-major Dependabot updates. The PR still merges only
# after the checks required by the branch ruleset pass.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    # The PR author, not github.actor: the actor can be someone re-running a job.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # to merge
      pull-requests: write # to enable auto-merge
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
