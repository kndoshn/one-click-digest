name: Release Please

# On every push to main, release-please updates the release PR (version bump in
# package.json, package-lock.json and public/manifest.json, plus CHANGELOG.md).
# Merging that PR creates a draft release and its tag; the `publish` job then
# builds the zip from the tag, attests it, uploads it and publishes the release.

on:
  push:
    branches: [main]
  # Fallback for when a push to main does not start the workflow: run it by hand on main
  # (gh workflow run release-please.yml --ref main). The `release` environment rejects other refs.
  # Creating the release fails (403) while main's .github/workflows differ from the release commit,
  # because the App token has no workflows permission.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    # The App's private key is an environment secret; the environment only allows main.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so that CI runs on the release PR
      # (resources created with GITHUB_TOKEN do not trigger workflows).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Build and publish release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # No cache: release artifacts are built only from fresh downloads.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          minimum_release_age: 7d
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check versions
        run: |
          pkg=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./dist/manifest.json').version")
          if [ "$pkg" != "$TAG" ] || [ "$manifest" != "$TAG" ]; then
            echo "::error::Version mismatch: tag $TAG, package.json $pkg, manifest.json $manifest"
            exit 1
          fi

      - name: Create extension zip
        run: |
          cd dist
          zip -r "../one-click-digest-$TAG.zip" .

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: one-click-digest-${{ needs.release-please.outputs.tag_name }}.zip

      # The release is a draft until the zip is attached, so it can be immutable once published.
      - name: Upload zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "one-click-digest-$TAG.zip" --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
